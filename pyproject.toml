[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mondo-music-video"
version = "1.12.2"
description = "Turn a song into a music video. Beat-aware shot planning, LLM-written prompts, local or hosted rendering, actors that dance, lip-sync and play instruments, Worlds, storyboards, and frame-exact assembly with your original audio. Agent-installable, with MCP tools and Open Actor/Prop Protocols."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.12,<2", "librosa>=0.11,<2",
  "torch>=2.6,<3", "transformers>=5.17,<6", "safetensors>=0.5,<1",
  "open-actor-protocol @ git+https://github.com/hodgemann/oap@328e2323456f3c50fce465f1a4393e48a2d4bf0e",
  "open-prop-protocol[crypto] @ git+https://github.com/hodgemann/opp@ec097e132b1af8af4d0be38338aa542c337b2e42",
]

[project.optional-dependencies]
comfy = [
  "comfy-sdk @ git+https://github.com/Comfy-Org/comfy-python-sdk@6d2dd7233dfa0a1abdf199beada55b2282e26b44",
  "comfy-api-proxy @ git+https://github.com/Comfy-Org/comfy-api-proxy@1569dc17ec0dd293d4b9a0723e142204dacedb85",
]
test = ["httpx>=0.27,<1", "pytest>=7,<10", "pytest-xdist>=3.5,<4"]
mcp = ["mcp>=2,<3"]

[tool.pytest.ini_options]
addopts = "-n 4"
testpaths = ["tests"]

[project.scripts]
mondo-music-video = "mmv.setup:main"
mondo-music-video-agent = "mmv.agent:main"
mondo-music-video-mcp = "mmv.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmv*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["*.html", "*.js", "*.css", "*.ico", "*.svg", "js/*.js", "vendor/wavesurfer/*.js", "vendor/wavesurfer/LICENSE", "vendor/wavesurfer/plugins/*.js"]
mmv = ["assets/props/*/manifest.json", "assets/props/*/references/*/*.png", "assets/props/README.md"]
"mmv.engine" = ["config/*.json", "prompts/*.md", "workflows/*.json"]
"mmv.engine.validators" = ["laya/*.py", "laya/*.md"]

[tool.setuptools.data-files]
"share/mondo-music-video/docs" = ["docs/OPEN_PROP_PROTOCOL.md", "docs/QUALITY_VISION_SETUP.md"]
"share/mondo-music-video/skills/mondo-music-video" = ["skills/mondo-music-video/SKILL.md", "skills/mondo-music-video/LICENSE"]
"share/mondo-music-video/skills/mondo-music-video/agents" = ["skills/mondo-music-video/agents/openai.yaml"]
"share/mondo-music-video/skills/mondo-music-video/references" = ["skills/mondo-music-video/references/requests.md"]

"share/mondo-music-video/examples/starter-cast" = ["examples/starter-cast/manifest.json", "examples/starter-cast/README.md", "examples/starter-cast/animal_pig.oap", "examples/starter-cast/robobabe1.oap", "examples/starter-cast/henchman_1.oap", "examples/starter-cast/human_female_casual_01.oap"]

"share/mondo-music-video/examples/style-presets" = ["examples/style-presets/manifest.json", "examples/style-presets/README.md", "examples/style-presets/sun_bleach.json", "examples/style-presets/nature_doc.json", "examples/style-presets/industrial_decay.json", "examples/style-presets/noir_bw.json", "examples/style-presets/gel_wash_psych.json", "examples/style-presets/crt_1990s.json"]
